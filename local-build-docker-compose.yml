version: '3'
services:
  broker:
    build:
      context: .
      dockerfile: ./cmd/brokerapi/Dockerfile
    restart: always
    depends_on:
      - redis
    ports:
      - 8001:8001
    networks:
      - app-net
    environment:
      BROKER_FEE_TBPS: "${BROKER_FEE_TBPS}"
      REDIS_ADDR: "${REDIS_ADDR}"
      REDIS_PW: "${REDIS_PW}"
      CONFIG_PATH: /broker_config
      KEYFILE_PATH: /keyfile/
    logging:
      options:
        max-size: "10m"
        max-file: "10"
    configs:
      - broker_config
    volumes:
      - mydata:/keyfile

  executorws:
    build:
      context: .
      dockerfile: ./cmd/executorws/Dockerfile
    restart: always
    depends_on:
      - redis
    ports:
      - 8080:8080
    networks:
      - app-net
    environment:
      REDIS_ADDR: "${REDIS_ADDR}"
      REDIS_PW: "${REDIS_PW}"
      WS_ADDR: "${WS_ADDR}"
      BROKER_FEE_TBPS: "${BROKER_FEE_TBPS}"
      CONFIG_PATH: /broker_config
    logging:
      options:
        max-size: "10m"
        max-file: "10"
    configs:
      - broker_config

  redis:
    image: redis
    command: redis-server --requirepass ${REDIS_PW}
    environment:
      - TZ=UTC
    ports:
      - "6379:6379"
    networks:
      - app-net
    restart: on-failure
    logging:
      options:
        max-size: "10m"
        max-file: "10"

networks:
  app-net:

configs:
  broker_config:
    file: ./config/chainConfig.json

volumes:
  mydata:
